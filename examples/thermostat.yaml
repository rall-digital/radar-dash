# wall-thermostat-card: a thermostat dial for ONE climate entity. Works on any dashboard, at ordinary card sizes.
# Needs one resource: wall-radar-card.js, which loads this card too (the card does not use the radar).
#
# climate.living_room is a PLACEHOLDER: replace it with one of your climate entities.
type: custom:wall-thermostat-card
entity: climate.living_room

# Optional. Left out, the card shows the entity's own friendly name.
# name: Living room
